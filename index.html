<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inovagro - Agricultura de Precisão</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b110b;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* IMAGEM DE FUNDO - NITIDEZ AJUSTADA ATRÁS DE TUDO */
        .bg-fundo-agro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('Agro.png');
            background-size: cover;
            background-position: center;
            z-index: -1; 
            opacity: 0.7; /* Imagem mais visível no fundo */
            pointer-events: none;
        }

        .main-content {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 5;
        }

        /* CORREÇÃO: Fundo preto removido e transformado em transparente */
        .brand-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: transparent; /* 100% transparente */
            padding: 20px;
            max-width: 550px;
            width: 90%;
        }

        .center-logo {
            font-size: 65px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #00ff87;
            /* Sombra escura forte atrás da letra para não sumir no fundo claro */
            text-shadow: 3px 3px 15px rgba(0, 0, 0, 0.9), -3px -3px 15px rgba(0, 0, 0, 0.9);
            margin-bottom: 10px;
        }

        .tagline {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 35px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.9);
        }

        .cta-button {
            background-color: #00ff87;
            color: #040704;
            border: none;
            padding: 18px 40px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 25px rgba(0, 255, 135, 0.4);
            transition: all 0.25s ease;
            text-transform: uppercase;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            background-color: #00ffaa;
            box-shadow: 0 6px 30px rgba(0, 255, 135, 0.7);
        }

        /* SIMULADOR (Mantém um fundo sutil apenas para os números ficarem legíveis) */
        .tool-section {
            background: rgba(10, 25, 15, 0.95);
            backdrop-filter: blur(15px);
            border: 2px solid #00ff87;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            text-align: left;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .tool-section h3 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #00ff87;
        }

        .tool-section p {
            color: #a0a5a0;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ff87;
            padding: 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            width: 100px;
        }

        .results {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .results p {
            margin-bottom: 10px;
            color: #fff;
        }

        .results strong {
            color: #00ff87;
        }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-align: center;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="bg-fundo-agro"></div>

    <main class="main-content">
        
        <div class="brand-section" id="welcome-screen">
            <h1 class="center-logo">Inovagro</h1>
            <p class="tagline">Tecnologia e Sustentabilidade em Movimento</p>
            <button class="cta-button" id="open-tool-btn">Acessar Painel Interativo</button>
        </div>

        <div class="tool-section hidden" id="tool-screen">
            <h3>Simulador Agro-Tech</h3>
            <p>Insira a área da fazenda para calcular a estimativa de impacto:</p>
            
            <div class="input-group">
                <input type="number" id="hectares-input" placeholder="Ex: 100" min="1">
                <span>Hectares</span>
            </div>

            <div class="results">
                <p>💧 Água economizada: <strong id="result-agua">0</strong> mil litros/ano</p>
                <p>🌱 Redução de Carbono: <strong id="result-carbono">0</strong> ton/ano</p>
            </div>

            <button class="back-btn" id="close-tool-btn">Voltar ao Menu</button>
        </div>

    </main>

    <script>
        const welcomeScreen = document.getElementById('welcome-screen');
        const toolScreen = document.getElementById('tool-screen');
        const openToolBtn = document.getElementById('open-tool-btn');
        const closeToolBtn = document.getElementById('close-tool-btn');
        
        const hectaresInput = document.getElementById('hectares-input');
        const resultAgua = document.getElementById('result-agua');
        const resultCarbono = document.getElementById('result-carbono');

        if (openToolBtn && welcomeScreen && toolScreen) {
            openToolBtn.addEventListener('click', () => {
                welcomeScreen.classList.add('hidden');
                toolScreen.classList.remove('hidden');
            });
        }

        if (closeToolBtn && toolScreen && welcomeScreen) {
            closeToolBtn.addEventListener('click', () => {
                toolScreen.classList.add('hidden');
                welcomeScreen.classList.remove('hidden');
            });
        }

        if (hectaresInput && resultAgua && resultCarbono) {
            hectaresInput.addEventListener('input', () => {
                const hectares = parseFloat(hectaresInput.value);

                if (isNaN(hectares) || hectares <= 0) {
                    resultAgua.innerText = '0';
                    resultCarbono.innerText = '0';
                    return;
                }

                const aguaEconomizada = hectares * 12;
                const carbonoReduzido = (hectares * 0.4).toFixed(1);

                resultAgua.innerText = aguaEconomizada;
                resultCarbono.innerText = carbonoReduzido;
            });
        }
    </script>

</body>
</html>
